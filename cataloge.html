<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتالوج الكتب - Smart Library</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --warning-color: #e67e22;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--primary-color);
            color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 20px auto;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box input {
            padding: 10px 15px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover { background-color: #2980b9; }
        .btn-success { background-color: var(--success-color); }
        .btn-success:hover { background-color: #219653; }

        .category-badge {
            background: var(--warning-color);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 15px;
        }

        /* شبكة عرض الكتب */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .book-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s;
        }

        .book-card:hover {
            transform: translateY(-5px);
        }

        .book-cover {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-color: #ddd;
        }

        .book-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .book-title {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .book-author {
            font-size: 0.9rem;
            color: var(--warning-color);
            margin-bottom: 10px;
            font-weight: bold;
        }

        .book-desc {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 15px;
            flex-grow: 1;
            line-height: 1.4;
        }

        .book-actions {
            display: flex;
            gap: 8px;
        }

        .book-actions button {
            flex: 1;
            padding: 8px;
            font-size: 0.9rem;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        .btn-read { background-color: #34495e; color: white; }
        .btn-borrow { background-color: var(--warning-color); color: white; }
        .btn-borrow.borrowed { background-color: #95a5a6; cursor: not-allowed; }

        /* نوافذ منبثقة (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #aaa;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-group textarea { height: 120px; }
    </style>
</head>
<body>

    <header>
        <h1>كتالوج المكتبة الذكية</h1>
        <p>استعرض واقرا الكتب المتاحة في المنصة</p>
    </header>

    <div class="controls">
        <div style="display: flex; gap: 10px; align-items: center;">
            <a href="catalogue.html" class="btn" style="background-color: #7f8c8d;">كل الكتب</a>
            <span id="categoryTitle" class="category-badge" style="margin: 0; display: none;"></span>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن كتاب..." onkeyup="filterBooks()">
        </div>
        <button class="btn btn-success" onclick="openAddModal()">+ إضافة كتاب جديد</button>
    </div>

    <!-- شبكة الكتب -->
    <div class="books-grid" id="booksGrid"></div>

    <!-- نافذة قراءة الكتاب -->
    <div class="modal" id="readModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('readModal')">&times;</span>
            <h2 id="readTitle" style="color: var(--primary-color); margin-bottom: 10px;"></h2>
            <h4 id="readAuthor" style="color: var(--warning-color); margin-bottom: 20px;"></h4>
            <p id="readContent" style="line-height: 1.8; color: #444; white-space: pre-line;"></p>
        </div>
    </div>

    <!-- نافذة إضافة كتاب -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('addModal')">&times;</span>
            <h2 style="margin-bottom: 20px;">إضافة كتاب جديد للمنصة</h2>
            <div class="form-group">
                <label>عنوان الكتاب:</label>
                <input type="text" id="newTitle" placeholder="أدخل عنوان الكتاب">
            </div>
            <div class="form-group">
                <label>اسم المؤلف:</label>
                <input type="text" id="newAuthor" placeholder="اسم المؤلف">
            </div>
            <div class="form-group">
                <label>التصنيف:</label>
                <select id="newCategory">
                    <option value="programming">برمجة (Programming)</option>
                    <option value="ai">ذكاء اصطناعي (AI)</option>
                    <option value="science">علوم عامة (Science)</option>
                </select>
            </div>
            <div class="form-group">
                <label>رابط صورة الغلاف (URL):</label>
                <input type="text" id="newCover" placeholder="رابط الصورة">
            </div>
            <div class="form-group">
                <label>نبذة مختصرة:</label>
                <input type="text" id="newDesc" placeholder="وصف قصير للكتاب">
            </div>
            <div class="form-group">
                <label>محتوى الكتاب للقراءة:</label>
                <textarea id="newContent" placeholder="اكتب أو الصق محتوى الكتاب..."></textarea>
            </div>
            <button class="btn btn-success" style="width: 100%;" onclick="addNewBook()">نشر الكتاب</button>
        </div>
    </div>

    <script>
        // قاعدة بيانات افتراضية للكتب تحتوي على تصنيفات
        let defaultBooks = [
            {
                id: 1,
                title: "Clean Code",
                author: "Robert C. Martin",
                category: "programming",
                cover: "https://m.media-amazon.com/images/I/71sBtM3Yi5L._AC_UF1000,1000_QL80_.jpg",
                desc: "دليل شامل لكتابة كود برمجي نظيف واحترافي.",
                content: "الفصل الأول: كود نظيف.\nالكود سيظل موجوداً دائماً مهما حدث. الهدف من هندسة البرمجيات هو إدارة التعقيد وكتابة برمجيات يفهمها البشر.",
                borrowed: false
            },
            {
                id: 2,
                title: "Python Crash Course",
                author: "Eric Matthes",
                category: "programming",
                cover: "https://m.media-amazon.com/images/I/71V23u65J6L._AC_UF1000,1000_QL80_.jpg",
                desc: "مقدمة عملية وسريعة للغة بايثون ومشاريع التطبيق.",
                content: "الفصل الأول: البداية مع Python.\nتعتبر بايثون من أسهل وأقوى لغات البرمجة استخداماً في تطوير الويب والذكاء الاصطناعي.",
                borrowed: false
            },
            {
                id: 3,
                title: "Hands-On Machine Learning",
                author: "Aurélien Géron",
                category: "ai",
                cover: "https://m.media-amazon.com/images/I/81kqrWpORFL._AC_UF1000,1000_QL80_.jpg",
                desc: "تعلم الآلة والشبكات العصبية باستخدام TensorFlow.",
                content: "الفصل الأول: نظرة عامة على تعلم الآلة.\nالتعلم الآلي هو علم تمكين الحواسيب من التعلم دون أن يتم برمجتها بشكل صريح.",
                borrowed: false
            }
        ];

        let books = JSON.parse(localStorage.getItem('smart_library_books')) || defaultBooks;

        // قراءة التصنيف من الرابط (URL parameters) مثل ?category=programming
        const urlParams = new URLSearchParams(window.location.search);
        const currentCategory = urlParams.get('category');

        function renderBooks(booksToDisplay) {
            const grid = document.getElementById('booksGrid');
            grid.innerHTML = '';

            if (booksToDisplay.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #7f8c8d; font-size: 1.2rem; padding: 40px;">لا توجد كتب مضافة في هذا القسم حالياً.</p>';
                return;
            }

            booksToDisplay.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <img src="${book.cover || 'https://via.placeholder.com/280x250?text=No+Cover'}" alt="${book.title}" class="book-cover">
                    <div class="book-info">
                        <h3 class="book-title">${book.title}</h3>
                        <p class="book-author">بقلم: ${book.author}</p>
                        <p class="book-desc">${book.desc}</p>
                        <div class="book-actions">
                            <button class="btn-read" onclick="readBook(${book.id})">اقرأ</button>
                            <button class="btn-borrow ${book.borrowed ? 'borrowed' : ''}" onclick="toggleBorrow(${book.id})">
                                ${book.borrowed ? 'مستعار حالياً' : 'استعارة'}
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterAndDisplay() {
            let filtered = books;
            if (currentCategory) {
                filtered = books.filter(b => b.category === currentCategory);
                const badge = document.getElementById('categoryTitle');
                badge.innerText = "التصنيف: " + currentCategory;
                badge.style.display = 'inline-block';
            }
            renderBooks(filtered);
        }

        function filterBooks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = books;
            if (currentCategory) {
                filtered = filtered.filter(b => b.category === currentCategory);
            }
            const searched = filtered.filter(b => b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query));
            renderBooks(searched);
        }

        function readBook(id) {
            const book = books.find(b => b.id === id);
            if (book) {
                document.getElementById('readTitle').innerText = book.title;
                document.getElementById('readAuthor').innerText = "تأليف: " + book.author;
                document.getElementById('readContent').innerText = book.content || "لا يتوفر محتوى نصي لهذا الكتاب حالياً.";
                document.getElementById('readModal').style.display = 'flex';
            }
        }

        function toggleBorrow(id) {
            const book = books.find(b => b.id === id);
            if (book) {
                book.borrowed = !book.borrowed;
                localStorage.setItem('smart_library_books', JSON.stringify(books));
                filterAndDisplay();
            }
        }

        function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
        function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }

        function addNewBook() {
            const title = document.getElementById('newTitle').value;
            const author = document.getElementById('newAuthor').value;
            const category = document.getElementById('newCategory').value;
            const cover = document.getElementById('newCover').value;
            const desc = document.getElementById('newDesc').value;
            const content = document.getElementById('newContent').value;

            if (!title || !author) {
                alert('الرجاء إدخال عنوان الكتاب واسم المؤلف!');
                return;
            }

            const newBook = {
                id: Date.now(),
                title,
                author,
                category,
                cover,
                desc,
                content,
                borrowed: false
            };

            books.push(newBook);
            localStorage.setItem('smart_library_books', JSON.stringify(books));
            filterAndDisplay();
            closeModal('addModal');

            // تفريغ الحقول
            document.getElementById('newTitle').value = '';
            document.getElementById('newAuthor').value = '';
            document.getElementById('newCover').value = '';
            document.getElementById('newDesc').value = '';
            document.getElementById('newContent').value = '';
        }

        // تشغيل العرض عند تحميل الصفحة
        filterAndDisplay();
    </script>
</body>
</html>
