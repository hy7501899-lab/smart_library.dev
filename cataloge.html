<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue - Smart Library</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: #333;
        }

        nav {
            background: var(--primary);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .cat-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            text-decoration: none;
            color: #555;
            font-size: 0.9rem;
        }

        .cat-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        .book-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .book-cover {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .book-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .book-title {
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: var(--primary);
        }

        .book-author {
            font-size: 0.85rem;
            color: #e67e22;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .book-desc {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-read { background: #34495e; color: white; }
        .btn-borrow { background: #e67e22; color: white; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <nav>
        <h2>📚 Smart Library</h2>
        <div>
            <a href="home.html">Home</a>
            <a href="catalogue.html">Catalogue</a>
        </div>
    </nav>

    <div class="container">
        <div class="categories">
            <a href="catalogue.html" class="cat-btn" id="cat-all">All Categories</a>
            <a href="catalogue.html?category=programming" class="cat-btn" id="cat-programming">Programming</a>
            <a href="catalogue.html?category=ai" class="cat-btn" id="cat-ai">Artificial Intelligence</a>
            <a href="catalogue.html?category=design" class="cat-btn" id="cat-design">Design</a>
            <a href="catalogue.html?category=business" class="cat-btn" id="cat-business">Business</a>
            <a href="catalogue.html?category=datascience" class="cat-btn" id="cat-datascience">Data Science</a>
            <a href="catalogue.html?category=technology" class="cat-btn" id="cat-technology">Technology</a>
        </div>

        <div class="books-grid" id="booksContainer"></div>
    </div>

    <div class="modal" id="readModal">
        <div class="modal-content">
            <h3 id="modalTitle"></h3>
            <p id="modalAuthor" style="color: #e67e22; margin: 10px 0;"></p>
            <p id="modalText" style="line-height: 1.6; white-space: pre-line;"></p>
            <button onclick="closeModal()" style="margin-top: 15px; padding: 8px 16px; cursor: pointer;">Close</button>
        </div>
    </div>

    <script>
        // قاعدة البيانات الشاملة لكل الأقسام
        const allBooks = [
            // Programming
            { id: 1, category: 'programming', title: 'Clean Code', author: 'Robert C. Martin', cover: 'https://m.media-amazon.com/images/I/71sBtM3Yi5L._AC_UF1000,1000_QL80_.jpg', desc: 'A Handbook of Agile Software Craftsmanship.', text: 'Chapter 1: Clean Code.\nEven bad code can function. But if code isn\'t clean, it can bring a development organization to its knees.' },
            { id: 2, category: 'programming', title: 'Python Crash Course', author: 'Eric Matthes', cover: 'https://m.media-amazon.com/images/I/71V23u65J6L._AC_UF1000,1000_QL80_.jpg', desc: 'A Hands-On, Project-Based Introduction to Programming.', text: 'Chapter 1: Getting Started with Python.\nPython is a versatile and readable programming language ideal for beginners and experts.' },
            
            // AI
            { id: 3, category: 'ai', title: 'Hands-On Machine Learning', author: 'Aurélien Géron', cover: 'https://m.media-amazon.com/images/I/81kqrWpORFL._AC_UF1000,1000_QL80_.jpg', desc: 'Concepts, Tools, and Techniques to Build Intelligent Systems.', text: 'Chapter 1: The Machine Learning Landscape.\nMachine Learning is the science of programming computers so they can learn from data.' },
            { id: 4, category: 'ai', title: 'Deep Learning', author: 'Ian Goodfellow', cover: 'https://m.media-amazon.com/images/I/61ScEipC3-L._AC_UF1000,1000_QL80_.jpg', desc: 'An MIT Press book on deep learning fundamentals.', text: 'Chapter 1: Introduction to Neural Networks.\nDeep learning allows computational models composed of multiple processing layers to learn representations.' },

            // Design
            { id: 5, category: 'design', title: 'The Design of Everyday Things', author: 'Don Norman', cover: 'https://m.media-amazon.com/images/I/71T0y2XJ7BL._AC_UF1000,1000_QL80_.jpg', desc: 'Fundamental principles of intuitive design.', text: 'Chapter 1: The Psychopathology of Everyday Things.\nTwo of the most important characteristics of good design are discoverability and understanding.' },

            // Business
            { id: 6, category: 'business', title: 'The Lean Startup', author: 'Eric Ries', cover: 'https://m.media-amazon.com/images/I/81vvgZqCskL._AC_UF1000,1000_QL80_.jpg', desc: 'How Constant Innovation Creates Radically Successful Businesses.', text: 'Chapter 1: Start.\nStartup success is not the result of good genes or being in the right place at the right time. Startup success can be engineered.' },

            // Data Science
            { id: 7, category: 'datascience', title: 'Python for Data Analysis', author: 'Wes McKinney', cover: 'https://m.media-amazon.com/images/I/81w--G4UuLL._AC_UF1000,1000_QL80_.jpg', desc: 'Data Wrangling with Pandas, NumPy, and Jupyter.', text: 'Chapter 1: Data Analytics Essentials.\nData science encompasses data processing, statistical analysis, and machine learning.' },

            // Technology
            { id: 8, category: 'technology', title: 'The Pragmatic Programmer', author: 'Andrew Hunt', cover: 'https://m.media-amazon.com/images/I/71f743sOPmL._AC_UF1000,1000_QL80_.jpg', desc: 'Your Journey To Mastery in technology.', text: 'Chapter 1: A Pragmatic Philosophy.\nPragmatic Programmers take responsibility for their own career and aren\'t afraid to admit ignorance or error.' }
        ];

        // قراءة الـ Category من الـ URL
        const params = new URLSearchParams(window.location.search);
        let selectedCat = params.get('category');

        // تحديد الزر النشط
        if (selectedCat) {
            const activeBtn = document.getElementById(`cat-${selectedCat}`);
            if (activeBtn) activeBtn.classList.add('active');
        } else {
            document.getElementById('cat-all').classList.add('active');
        }

        // تصفية الكتب
        const filteredBooks = selectedCat 
            ? allBooks.filter(b => b.category.toLowerCase() === selectedCat.toLowerCase()) 
            : allBooks;

        // عرض الكتب
        const container = document.getElementById('booksContainer');
        if (filteredBooks.length === 0) {
            container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; font-size: 1.2rem; color: #888; padding: 40px;">No books found in this category.</p>`;
        } else {
            container.innerHTML = filteredBooks.map(book => `
                <div class="book-card">
                    <img src="${book.cover}" class="book-cover" alt="${book.title}">
                    <div class="book-info">
                        <h4 class="book-title">${book.title}</h4>
                        <span class="book-author">${book.author}</span>
                        <p class="book-desc">${book.desc}</p>
                        <div class="actions">
                            <button class="btn btn-read" onclick="readBook(${book.id})">Read</button>
                            <button class="btn btn-borrow" onclick="alert('Book borrowed successfully!')">Borrow</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function readBook(id) {
            const book = allBooks.find(b => b.id === id);
            if (book) {
                document.getElementById('modalTitle').innerText = book.title;
                document.getElementById('modalAuthor').innerText = 'Author: ' + book.author;
                document.getElementById('modalText').innerText = book.text;
                document.getElementById('readModal').style.display = 'flex';
            }
        }

        function closeModal() {
            document.getElementById('readModal').style.display = 'none';
        }
    </script>
</body>
</html>
