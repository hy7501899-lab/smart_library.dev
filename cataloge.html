<div id="books-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px;"></div>

<script>
  fetch('./books.json')
    .then(response => response.json())
    .then(books => {
      const container = document.getElementById('books-container');
      if (!container) return;

      container.innerHTML = books.map(book => `
        <div style="background: #1e1b4b; border-radius: 12px; padding: 15px; color: white; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
          <img src="${book.cover}" alt="${book.title}" style="width: 120px; height: 160px; object-fit: cover; border-radius: 8px; margin-bottom: 10px;">
          <h3 style="font-size: 15px; margin: 5px 0; height: 40px; overflow: hidden;">${book.title}</h3>
          <p style="font-size: 12px; color: #a5b4fc; margin-bottom: 15px;">${book.author}</p>
          <a href="${book.readUrl}" target="_blank" style="background: #7c3aed; color: white; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-size: 13px; display: inline-block; font-weight: bold;">📖 اقرأ الآن</a>
        </div>
      `).join('');
    });
</script>
