<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<header class="navbar inner-navbar">
    <a href="home.html" class="logo">📚 Smart Library</a>
    <nav>
        <a href="home.html">Home</a>
        <a href="catalogue.html">Catalogue</a>
    </nav>
</header>

<main class="auth-main">
    <section class="auth-card">
        <h2>Login to Your Account</h2>
        <p class="subtitle">Continue exploring your digital library.</p>

        <form id="loginForm">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" required placeholder="name@example.com">

            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" required placeholder="••••••••">

            <button type="submit" class="auth-btn">Login</button>
            <p id="loginMessage" class="auth-message"></p>
        </form>

        <p class="auth-switch">
            Don't have an account? <a href="register.html">Register</a>
        </p>
    </section>
</main>

<script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value.trim();
        const message = document.getElementById("loginMessage");

        // حفظ الجلسة محلياً والتحويل فوراً
        localStorage.setItem("smart_library_token", "demo-token-123");
        localStorage.setItem("smart_library_user", JSON.stringify({ id: 1, name: "Yara", email: email }));

        message.style.color = "green";
        message.textContent = "Login successful! Redirecting...";

        setTimeout(() => {
            window.location.href = "home.html";
        }, 800);
    });
</script>

</body>
</html>
